{{- /*
The Runtime's own secrets, made once and kept across upgrades (`lookup`): the tokens between its
services, the admin key Studio uses, the vault key only the gateway reads, the computer ticket key
(Ed25519), and, for the bundled stores, their passwords. Never in values.
*/ -}}
{{- $name := include "nylorun.secret" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $keep := dict -}}
{{- range $k, $v := $old }}{{ $_ := set $keep $k ($v | b64dec) }}{{ end -}}
{{- $seed := randAlphaNum 64 | sha256sum -}}
{{- $hostId := printf "host_%s" (trunc 26 $seed) -}}
{{- /* Tokens and the admin key are 32 bytes as hex, as `nylorun start` makes them; a kept value
in another form (charts before 0.53.1) is replaced. */ -}}
{{- $hex := "^[0-9a-f]{64}$" -}}
{{- $gates := get $keep "gatesToken" -}}
{{- if not (regexMatch $hex $gates) }}{{ $gates = randAlphaNum 64 | sha256sum }}{{ end -}}
{{- $harness := get $keep "harnessToken" -}}
{{- if not (regexMatch $hex $harness) }}{{ $harness = randAlphaNum 64 | sha256sum }}{{ end -}}
{{- $sandboxes := get $keep "sandboxesToken" -}}
{{- if not (regexMatch $hex $sandboxes) }}{{ $sandboxes = randAlphaNum 64 | sha256sum }}{{ end -}}
{{- $admin := get $keep "adminKey" -}}
{{- if not (regexMatch $hex $admin) }}{{ $admin = randAlphaNum 64 | sha256sum }}{{ end -}}
{{- $kek := get $keep "vaultKek" | default (randBytes 32) -}}
{{- $ticket := get $keep "ticketKey" | default (genPrivateKey "ed25519") -}}
{{- $hostJson := get $keep "host.json" | default (dict "format" 1 "hostId" $hostId "host" (.Values.ingress.host | default "localhost") "port" 443 | toJson) -}}
{{- $pgPassword := get $keep "postgresPassword" | default (randAlphaNum 32) -}}
{{- $s3Access := get $keep "accessKey" | default (.Values.objectStore.accessKey | default (randAlphaNum 20)) -}}
{{- $s3Secret := get $keep "secretKey" | default (.Values.objectStore.secretKey | default (randAlphaNum 40)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "nylorun.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  gatesToken: {{ $gates | quote }}
  harnessToken: {{ $harness | quote }}
  sandboxesToken: {{ $sandboxes | quote }}
  adminKey: {{ $admin | quote }}
  host-credentials.json: {{ dict "format" 1 "adminKey" $admin | toJson | quote }}
  host.json: {{ $hostJson | quote }}
  vaultKek: {{ $kek | quote }}
  ticketKey: {{ $ticket | quote }}
  {{- if and .Values.postgres.bundled.enabled (not .Values.postgres.url) (not .Values.postgres.existingSecret) }}
  postgresPassword: {{ $pgPassword | quote }}
  url: {{ printf "postgres://nylorun:%s@%s-postgres:5432/nylorun" $pgPassword (include "nylorun.name" .) | quote }}
  {{- else if .Values.postgres.url }}
  url: {{ .Values.postgres.url | quote }}
  {{- end }}
  {{- if not .Values.objectStore.existingSecret }}
  accessKey: {{ $s3Access | quote }}
  secretKey: {{ $s3Secret | quote }}
  {{- end }}
