{{- $n := include "nylorun.name" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $n }}-runtime
  labels: {{- include "nylorun.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required with the ingress" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $n }}-runtime, port: { name: api } } }
---
{{- end }}
{{- if .Values.prepull.enabled }}
# Warms atelet's image cache on the worker nodes (Substrate 1.0 has no pre-pull): the Runtime
# image the computers mount the engine from, and the listed computer images.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $n }}-prepull
  labels: {{- include "nylorun.labels" . | nindent 4 }}
data:
  refs.txt: |
    {{- include "nylorun.image.runtime" . | nindent 4 }}
    {{- range .Values.prepull.images }}
    {{ . }}
    {{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $n }}-prepull
  labels: {{- include "nylorun.labels" . | nindent 4 }}
    app.kubernetes.io/component: prepull
spec:
  selector:
    matchLabels: {{- include "nylorun.selector" (dict "root" . "component" "prepull") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nylorun.selector" (dict "root" . "component" "prepull") | nindent 8 }}
      annotations:
        checksum/refs: {{ toJson .Values.prepull.images | sha256sum | trunc 16 }}
    spec:
      {{- with .Values.prepull.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prepull.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fill
          image: {{ .Values.images.golang }}
          securityContext: { runAsUser: 0 }
          resources: { requests: { cpu: 500m, memory: 1Gi } }
          command: [bash, -ceu]
          args:
            - |
              git clone -q --filter=blob:none https://github.com/agent-substrate/substrate.git /src
              cd /src && git checkout -q {{ required "prepull.substrateCommit is required with the pre-pull" .Values.prepull.substrateCommit }}
              CGO_ENABLED=0 go build -mod=vendor -o /tmp/validate-image-cache ./tools/validate-image-cache
              /tmp/validate-image-cache --cache-dir /var/lib/ate/image-cache --refs-file /refs/refs.txt \
                --out /tmp/prepull.csv --min-free-gb 0 --evict-idle 24h --force
              sed 's/^/PREPULL /' /tmp/prepull.csv
          volumeMounts:
            - { name: ate, mountPath: /var/lib/ate }
            - { name: refs, mountPath: /refs }
      containers:
        - name: done
          image: {{ .Values.images.pause }}
          resources: { requests: { cpu: 1m, memory: 8Mi } }
      volumes:
        - { name: ate, hostPath: { path: /var/lib/ate, type: Directory } }
        - { name: refs, configMap: { name: {{ $n }}-prepull } }
---
{{- end }}
{{- if .Values.substrate.setup.enabled }}
# The Tenant's atespace and its editor binding, made once by one of Substrate's owners.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $n }}-substrate-setup
  labels: {{- include "nylorun.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $n }}-sandboxes
      {{- include "nylorun.podSecurity" . | nindent 6 }}
        runAsUser: 65532
        runAsGroup: 65532
      {{- include "nylorun.placement" . | nindent 6 }}
      containers:
        - name: setup
          image: {{ include "nylorun.image.sandboxes" . }}
          args: [substrate-setup]
          {{- include "nylorun.containerSecurity" . | nindent 10 }}
          env:
            - { name: NYLORUN_SANDBOXES_DIR, value: /run/nylorun/sandboxes }
            - { name: NYLORUN_SUBSTRATE_OWNER_TOKEN_FILE, value: /run/nylorun/owner/token }
            - { name: NYLORUN_SUBSTRATE_CA_FILE, value: /var/run/secrets/ate/ca.pem }
          volumeMounts:
            - { name: cluster, mountPath: /run/nylorun/sandboxes, readOnly: true }
            - { name: owner, mountPath: /run/nylorun/owner, readOnly: true }
            - { name: ate, mountPath: /var/run/secrets/ate, readOnly: true }
      volumes:
        - name: cluster
          configMap: { name: {{ $n }}-sandboxes }
        - name: owner
          secret: { secretName: {{ required "substrate.setup.ownerTokenSecret is required with the setup" .Values.substrate.setup.ownerTokenSecret }} }
        - name: ate
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector: { matchLabels: { podcert.ate.dev/canarying: live } }
                  path: ca.pem
{{- end }}
