# The Nylorun Runtime on an Agent Substrate cluster (charts/nylorun-runtime/README.md).
# Every Agent with a sandbox gets a computer (ADR-149): the loop runs in the harness, and
# commands and files reach the Agent's actor through the sandbox gateway and atenet-router.

# The Runtime, Studio and sandboxes images. Pin them by digest in production
# (`ghcr.io/nylorun/runtime@sha256:…`); empty uses the chart's appVersion tag.
images:
  runtime: ""
  studio: ""
  sandboxes: ""
  # The stores, when bundled; the tags `nylorun start` runs.
  postgres: postgres:17.11
  restate: docker.restate.dev/restatedev/restate:1.7.12
  s2: ghcr.io/s2-streamstore/s2:0.43.0
  rustfs: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
  # The pre-pull DaemonSet's helpers.
  golang: golang:1.27.3-bookworm@sha256:dc0963f32053e4bc451d24d87e3892d42d01021b61f093e98eb95c0352bb84b0
  pause: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
imagePullSecrets: []

# The Tenant this Runtime serves; it is created on the first start.
tenant:
  name: default

# The URL clients reach the Runtime at (webhook URLs, the OAuth resource). Empty: the
# ingress's host over https, else the in-cluster Service.
publicUrl: ""

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

# The Runtime's Postgres. External (any managed Postgres with logical replication on and
# a C collation database), or a bundled StatefulSet.
postgres:
  # postgres://user:password@host:5432/nylorun
  url: ""
  # A Secret with key `url`, instead of `url`.
  existingSecret: ""
  bundled:
    enabled: true
    storage: 10Gi
    storageClass: ""

# The object store: any S3-compatible endpoint, or the bundled RustFS. One bucket holds
# the Runtime's objects and, with s2.objectStore, s2-lite's streams under their own prefix.
objectStore:
  endpoint: ""
  bucket: nylorun
  region: auto
  # A Secret with keys `accessKey` and `secretKey`; or the values below.
  existingSecret: ""
  accessKey: ""
  secretKey: ""
  bundled:
    enabled: true
    storage: 20Gi
    storageClass: ""

restate:
  storage: 10Gi
  storageClass: ""
  resources: {}

s2:
  # Keep s2-lite's streams in the object store (no disk); false keeps them on a disk.
  objectStore: true
  path: s2
  storage: 5Gi
  storageClass: ""

# Agent Substrate, installed by its own setup (README). The chart adds only the Tenant's
# atespace and the sandbox gateway's place on the router's allowlist (by the operator).
substrate:
  atespace: ""
  systemNamespace: ate-system
  apiService: api
  router: atenet-router.ate-system.svc:8444
  routerName: atenet-router.ate-system.svc
  # The worker pool's labels; empty: any.
  workerSelector: {}
  # Make the atespace and its editor binding at install (a Job), as one of Substrate's
  # owners: a Secret with key `token` holding an owner's Substrate token.
  setup:
    enabled: false
    ownerTokenSecret: ""

computer:
  port: 8080

sandboxGateway:
  replicas: 2
  resources: {}

# Where each component runs (Substrate's recommended layout: README).
placement:
  nodeSelector: {}
  tolerations: []

# Warms atelet's image cache on worker nodes with the Runtime image and these computer
# images, with Substrate's validate-image-cache built from its source at `substrateCommit`.
prepull:
  enabled: false
  substrateCommit: ""
  images: []
  nodeSelector: {}
  tolerations: []

studio:
  enabled: true

resources:
  runtime: {}
  gateway: {}
  harness: {}
  studio: {}
  sandboxes: {}
