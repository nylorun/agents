# ghcr.io/nylorun/dev: a coding agent's computer (images/dev, ADR-92 in nylorun/factory).
# On a pull request that changes images/dev: build it for amd64 and run its smoke test.
# By hand, from main: build it for amd64 and arm64, run the smoke test, and push one version tag.
# It releases on its own schedule (monthly, plus security fixes), not with the Runtime: every new
# digest is a cold pull on every node.
name: Dev image

on:
  pull_request:
    paths:
      - images/dev/**
      - .github/workflows/dev-image.yml
  workflow_dispatch:
    inputs:
      version:
        description: "The tag to push, a date: YYYY.MM.DD (a second build that day: YYYY.MM.DD.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/dev
          platforms: linux/amd64
          load: true
          tags: nylorun-dev:smoke

      - name: Smoke test
        run: bash images/dev/smoke.sh nylorun-dev:smoke

      - name: Check the version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::Publish from main only"; exit 1; }
          [[ "$VERSION" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::version is YYYY.MM.DD or YYYY.MM.DD.N"; exit 1; }
          if docker buildx imagetools inspect "ghcr.io/nylorun/dev:${VERSION}" >/dev/null 2>&1; then
            echo "::error::ghcr.io/nylorun/dev:${VERSION} exists; pick the next one"; exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'workflow_dispatch'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push amd64 and arm64
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nylorun/dev:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=A coding agent's computer: Ubuntu 24.04, the base toolchain, uv and mise

      - name: Summary
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/nylorun/dev:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "Pushed ghcr.io/nylorun/dev:${VERSION}@${digest}" >> "$GITHUB_STEP_SUMMARY"
