name: CI
# Two tiers. The fast tier (`check` and `runtime-unit`) runs on every PR and
# merge-queue entry, and the merge queue merges on it. The full tier (every other
# job) runs after the merge on main, on manual runs, and for release PRs (a
# change to .release/plan.json) on the PR and in the merge queue, so a release
# commit has passed the full suite before publish.yml publishes it. The merge
# queue lands the commit it checked, so a release commit's push on main runs the
# fast tier only: its full suite already passed there as `ci`.
#
# `ci` is the required check. A PR that is not a release reports `ci` at once
# (`pr-ready`), so auto-merge queues it without waiting and the merge queue runs
# the checks once; the PR's own summary, `ci (pull_request)`, is feedback.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which tier this run is: full on main, on manual runs, and when the run
  # changes the release plan (a release PR, or a merge group holding one). On
  # main, a push that changes the release plan runs the fast tier when the merge
  # queue's `ci` (its full tier) already passed on that commit.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          full=true
          if [[ -n "$BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --quiet "$BASE_SHA" HEAD -- .release/plan.json && full=false
          elif [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            if ! git diff --quiet "$BEFORE" HEAD -- .release/plan.json; then
              queue=$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                -f check_name=ci -f filter=latest \
                --jq '[.check_runs[] | select(.app.slug == "github-actions") | .conclusion] | first')
              echo "The merge queue's ci on $GITHUB_SHA: $queue"
              [[ "$queue" == success ]] && full=false
            fi
          fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
  # The required check on a PR that is not a release: it passes at once, so
  # auto-merge queues the PR right away and the merge queue runs the checks.
  # Named `ci` only where it runs, so a skipped copy never satisfies `ci`.
  pr-ready:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true'
    name: ${{ github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && 'ci' || 'pr-ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "The merge queue runs the checks for this PR; ci (pull_request) is feedback."
  # Fast tier: formatting, types, every package's unit tests and the package
  # checks on the pinned toolchain. Includes test:tooling, i.e. the Linux leg of
  # the supervisor and release tooling tests (see `macos`). The Runtime's unit
  # tests, the longest part, run beside it in `runtime-unit`. The examples tests
  # keep every Tenant in the test stack's Postgres
  # (runtime/server/test/stack/compose.yaml).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      - name: Start the test stack
        run: npm run test:stack:up --workspace @nylorun/runtime
      - run: npm run check -- --built --no-runtime-tests
      - run: npm run check:stack -- --built
      - name: Stop the test stack
        if: always()
        run: npm run test:stack:down --workspace @nylorun/runtime
  # Fast tier: the Runtime's unit tests in two shards, each with its own test
  # stack, every Tenant in its Postgres.
  runtime-unit:
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      # Workspaces run in flag order: keep dependency order.
      - run: npm run build --workspace @nylorun/core --workspace @nylorun/agents --workspace @nylorun/admin --workspace @nylorun/harness --workspace @nylorun/runtime
      - name: Start the test stack
        run: npm run test:stack:up --workspace @nylorun/runtime
      - name: Runtime unit tests, shard ${{ matrix.shard }}
        run: npm test --workspace @nylorun/runtime -- --shard=${{ matrix.shard }}
      - name: Stop the test stack
        if: always()
        run: npm run test:stack:down --workspace @nylorun/runtime
  # Full tier from here on (see the top of this file).
  #
  # End-to-end, in parallel with `check`: the packed starter on the Docker
  # stack with images built from this PR (scripts/lib/stack.mjs reuses the
  # images NYLORUN_RUNTIME_IMAGE / NYLORUN_STUDIO_IMAGE name), and the release
  # combination when a PR changes the release plan.
  smoke-starter:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Bound the job so a wedged runner cannot block the PR matrix indefinitely.
    timeout-minutes: 45
    env:
      NYLORUN_RUNTIME_IMAGE: nylorun-runtime:ci
      NYLORUN_STUDIO_IMAGE: nylorun-studio:ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # release-plan diff against the PR base
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      # The Runtime and Studio images from this PR, from the layer cache that
      # cache.yml writes on main.
      - uses: ./.github/actions/stack-images
      - name: Smoke starter
        # Healthy smoke is a few minutes; the in-process deadline is 20m. Keep
        # Actions above that so the script can report its own abort reason.
        timeout-minutes: 22
        run: npm run test:starter
      - name: Validate a proposed release
        if: github.event_name == 'pull_request'
        # release:check is ~2–10 min when healthy; afdaee7 Validate wedged >50 min
        # with no log progress on a frozen runner (cancel was 403 for the bot).
        timeout-minutes: 20
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if ! git diff --quiet "$BASE_SHA" HEAD -- .release/plan.json; then
            # check-example-assets needs the examples build that `check` makes.
            npm run build --prefix examples
            npm run release:check -- --built
          fi
  # `npm run dev` (the contributor loop) on the Docker stack with this PR's
  # images, and clean-checkout setup plus release preparation.
  smoke-dev:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NYLORUN_RUNTIME_IMAGE: nylorun-runtime:ci
      NYLORUN_STUDIO_IMAGE: nylorun-studio:ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      # The Runtime and Studio images from this PR, from the layer cache that
      # cache.yml writes on main.
      - uses: ./.github/actions/stack-images
      - name: Test dev
        timeout-minutes: 10
        run: npm run test:dev
      - name: Test setup
        timeout-minutes: 10
        run: npm run test:setup
  # Installation acceptance (I1–I9: one Tenant per installation) on the Docker
  # stack with this PR's images, driven by the packed nylorun, CLI and
  # @nylorun/admin under a temporary Host root; split into two groups with one
  # stack each.
  acceptance:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        scenarios: ["I1,I2,I3,I4,I5", "I6,I7,I8,I9"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NYLORUN_RUNTIME_IMAGE: nylorun-runtime:ci
      NYLORUN_STUDIO_IMAGE: nylorun-studio:ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm run setup
      # The Runtime and Studio images from this PR, from the layer cache that
      # cache.yml writes on main.
      - uses: ./.github/actions/stack-images
      - name: Installation acceptance
        timeout-minutes: 15
        run: npm run test:acceptance -- --only ${{ matrix.scenarios }}
  # macOS, the other supported developer OS (Windows developers use WSL2, which
  # is Linux): the CLI, which runs on the developer's machine, plus supervisor
  # and release tooling. The Runtime and Studio run in Linux containers, so
  # their tests stay on ubuntu (`check`, `integration`, `stack`).
  macos:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      # Bundled npm is enough: these tests only run npm ci and npm install.
      - run: npm ci
      # Workspaces run in flag order: keep dependency order. nylorun (with
      # nylo) needs core and admin, and agents for its tests; the deprecated
      # CLI runs nylorun's nylo.
      - run: npm run build --workspace @nylorun/core --workspace @nylorun/agents --workspace @nylorun/admin --workspace nylorun --workspace @nylorun/cli
      - name: nylorun and CLI tests
        run: npm test --workspace nylorun --workspace @nylorun/cli
      - name: Supervisor and release tooling
        run: node --test scripts/test/processes.test.mjs scripts/test/development.test.mjs scripts/test/release.test.mjs scripts/test/version-policy.test.mjs scripts/test/pins.test.mjs
  # Runtime integration tests against the Docker test stack (Postgres 17,
  # Restate, s2-lite, RustFS, and the OTel Collector of the R7 exit test) in
  # runtime/server/test/stack/compose.yaml, with test
  # Tenants in Postgres. They include the architecture §17 failure suite
  # (runtime/server/test/failure/README.md), which recreates the stack's Restate, and
  # the BlobStore conformance suite against the stack's RustFS. Then the runtime unit suite
  # with the gates over HTTP (NYLORUN_TEST_MODEL_GATE=http).
  integration:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      # Workspaces run in flag order: keep dependency order.
      - run: npm run build --workspace @nylorun/core --workspace @nylorun/agents --workspace @nylorun/admin --workspace @nylorun/harness --workspace @nylorun/runtime
      # With the `traces` profile: the stock OpenTelemetry Collector of the R7 exit test.
      - name: Start the test stack
        env:
          NYLORUN_TEST_PROFILES: traces
        run: npm run test:stack:up --workspace @nylorun/runtime
      - name: Runtime integration tests
        env:
          NYLORUN_TEST_STACK: "1"
          NYLORUN_TEST_S3_ENDPOINT: http://127.0.0.1:59000
        run: npm run test:integration --workspace @nylorun/runtime
      # `check` runs the unit suite with the gates in process; this runs it again with model
      # calls, remote MCP, HTTP tools and keys crossing a gates service on 127.0.0.1 with run
      # tokens, as the local stack does (F5).
      - name: Runtime unit tests, gates over HTTP
        env:
          NYLORUN_TEST_MODEL_GATE: http
        run: npm test --workspace @nylorun/runtime
      - name: Test stack logs
        if: failure()
        run: docker compose -f runtime/server/test/stack/compose.yaml --profile traces logs --no-color
      - name: Stop the test stack
        if: always()
        run: npm run test:stack:down --workspace @nylorun/runtime
  # `nylorun start` on Linux with the Runtime and Studio images built from this
  # PR, under a temporary Host root: status, /ready (Postgres, Restate, S2), the
  # stack's Tenant through @nylorun/admin, a Studio login, a Project linked by
  # `nylorun start`, the Restate identity key,
  # UID/GID ownership of the bind-mounted Host root, then `nylorun reset`. In
  # parallel, architecture §17 case 3 on its own stack (test:failure): the
  # runtime container killed mid model call (`docker compose kill`), then
  # started; the effect must become uncertain with no second model call
  # (scripts/smoke-failure.mjs), and the harness container killed mid model call
  # and mid bash. test:acceptance:access: subjects, scopes and owner isolation on
  # one Tenant, through app.as(...) (scripts/acceptance/access.mjs).
  # test:redteam: what code in the harness container can reach, from a container
  # of the harness service's own definition (scripts/smoke-redteam.mjs).
  stack:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        # test:t4-exit: track T4's exit test (scripts/t4-exit.mjs), schedules and a webhook on a
        # Compose Tenant with no client, a restart across due times included. test:t5-exit: track
        # T5's (scripts/t5-exit.mjs), a memory written in one fire and read in the next, with an
        # upgrade in between.
        smoke: ["test:stack", "test:failure", "test:acceptance:access", "test:redteam", "test:t4-exit", "test:t5-exit"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NYLORUN_RUNTIME_IMAGE: nylorun-runtime:ci
      NYLORUN_STUDIO_IMAGE: nylorun-studio:ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      # Workspaces run in flag order: keep dependency order.
      - run: npm run build --workspace @nylorun/core --workspace @nylorun/agents --workspace @nylorun/admin --workspace nylorun --workspace @nylorun/cli
      # The Runtime and Studio images from this PR, from the layer cache that
      # cache.yml writes on main. The release workflow builds the same
      # Dockerfiles for amd64 and arm64.
      - uses: ./.github/actions/stack-images
      - name: Smoke ${{ matrix.smoke }}
        timeout-minutes: 15
        run: npm run ${{ matrix.smoke }}
  # Newest Node line with its bundled npm, as a consumer would run it.
  consumers:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [26.x]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm ci
      # The runtime tests keep every Tenant in the test stack's Postgres.
      - name: Start the test stack
        run: npm run test:stack:up --workspace @nylorun/runtime
      # Declared workspace order is dependency order; each check builds its package.
      - run: npm run check --workspaces
      - name: Stop the test stack
        if: always()
        run: npm run test:stack:down --workspace @nylorun/runtime
  # The sandboxes service (sandboxes/, Go) and sandbox pods on kind, in two legs of
  # about the same length, each on a kind cluster of its own whose API server listens
  # on docker0's gateway (scripts/sandbox/kind.yaml). Every suite runs `nylorun sandbox
  # enable` itself, which installs agent-sandbox v1.0.5.
  #
  # service: go vet and go test; S0, the API server checked from a Compose-style
  # container; F7.2 8a, the service suite with busybox pods
  # (scripts/sandbox/service-suite.mjs): enable probes NetworkPolicy, then create,
  # suspend and resume with the service restarted mid-operation, delete, and no
  # docker.sock anywhere; F7.2 8c, the network invariant and the red-team from inside
  # the sandbox namespace (scripts/sandbox/pod-stack.mjs), each on a Tenant of its own
  # with a joined pod sandbox.
  #
  # pods: F7.2 8b, pod sandboxes end to end (scripts/sandbox/suite.mjs); R4, a custom
  # harness as a pod's image (scripts/sandbox/harness-pod.mjs); T2's and T3's exit tests
  # (scripts/sandbox/t2-exit.mjs, t3-exit.mjs).
  sandboxes:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        leg: [service, pods]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NYLORUN_RUNTIME_IMAGE: nylorun-runtime:ci
      NYLORUN_SANDBOXES_IMAGE: nylorun-sandboxes:ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        if: matrix.leg == 'service'
        with:
          go-version-file: sandboxes/go.mod
          cache-dependency-path: sandboxes/go.sum
      - name: go vet and go test
        if: matrix.leg == 'service'
        working-directory: sandboxes
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json
      - run: npm install --global npm@11.15.0
      - run: npm ci
      # Workspaces run in flag order: keep dependency order.
      - run: npm run build --workspace @nylorun/core --workspace @nylorun/agents --workspace @nylorun/admin --workspace nylorun --workspace @nylorun/cli
      - uses: ./.github/actions/stack-images
        with:
          sandboxes: "true"
      - name: kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: nylorun
          config: scripts/sandbox/kind.yaml
          node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      # The images sandbox pods use: the engine is copied from the runtime image into a
      # python:3.13-slim pod; busybox is the probe of the service suite and pod-stack.mjs.
      # Saved for the runner's platform only: with Docker's containerd image store, a pulled
      # multi-platform image holds this platform's layers alone, and kind's import of all
      # platforms (kind load docker-image) fails on the others' missing digests.
      - name: Load the pod images into kind
        run: |
          platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          docker pull --platform "$platform" python:3.13-slim
          images=("$NYLORUN_RUNTIME_IMAGE" python:3.13-slim)
          if [[ "${{ matrix.leg }}" == service ]]; then
            docker pull --platform "$platform" busybox:1.37.0
            images+=(busybox:1.37.0)
          fi
          docker save --platform "$platform" --output "$RUNNER_TEMP/pod-images.tar" "${images[@]}"
          kind load image-archive --name nylorun "$RUNNER_TEMP/pod-images.tar"
      # S0: a container on a Compose network verifies the API server's certificate at
      # docker0's gateway, as the sandboxes service does. (The enable probe checks the
      # pod → host route and kindnet's ipBlock /32 + port enforcement.)
      - name: S0 API route from a Compose network
        if: matrix.leg == 'service'
        run: |
          server=$(kubectl config view --minify --context kind-nylorun -o jsonpath='{.clusters[0].cluster.server}')
          echo "API server: $server"
          kubectl config view --minify --raw --context kind-nylorun \
            -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$RUNNER_TEMP/kind-ca.crt"
          docker network create nylorun-s0
          docker run --rm --network nylorun-s0 --add-host host.docker.internal:host-gateway \
            -v "$RUNNER_TEMP/kind-ca.crt:/ca.crt:ro" curlimages/curl:8.16.0 \
            -sS --max-time 10 --cacert /ca.crt "$server/version"
          docker network rm nylorun-s0
      - name: Sandboxes service suite
        if: matrix.leg == 'service'
        timeout-minutes: 25
        run: npm run test:sandboxes:service -- --context kind-nylorun --host-address 172.17.0.1
      - name: Sandbox network invariant
        if: matrix.leg == 'service'
        timeout-minutes: 15
        run: npm run test:sandboxes:network -- --context kind-nylorun --host-address 172.17.0.1
      - name: Sandbox red-team
        if: matrix.leg == 'service'
        timeout-minutes: 15
        run: npm run test:sandboxes:redteam -- --context kind-nylorun --host-address 172.17.0.1
      - name: Pod sandboxes suite
        if: matrix.leg == 'pods'
        timeout-minutes: 35
        run: npm run test:sandboxes -- --context kind-nylorun --host-address 172.17.0.1
      - name: Custom harness pod
        if: matrix.leg == 'pods'
        timeout-minutes: 25
        env:
          NYLORUN_EXAMPLE_HARNESS_IMAGE: nylorun-example-harness:ci
        run: |
          docker build --file examples/harness-minimal/Dockerfile --tag "$NYLORUN_EXAMPLE_HARNESS_IMAGE" .
          kind load docker-image --name nylorun "$NYLORUN_EXAMPLE_HARNESS_IMAGE"
          npm run test:sandboxes:harness -- --context kind-nylorun --host-address 172.17.0.1
      # T2's exit test as one scenario: nylorun apply on three files, the Agent triage and its
      # session triage-inbox on a pod, an undeclared secret refused at save, and Studio's list.
      - name: T2 exit test
        if: matrix.leg == 'pods'
        timeout-minutes: 25
        env:
          NYLORUN_STUDIO_IMAGE: nylorun-studio:ci
        run: npm run test:t2-exit -- --context kind-nylorun --host-address 172.17.0.1
      # T3's exit test as one scenario: a busy pod Agent moves three times (an instruction change
      # at the next turn, a runtime change at the pod's next start on the same volume, a failed
      # setup that goes back), keeping its id, vault, session and disk.
      - name: T3 exit test
        if: matrix.leg == 'pods'
        timeout-minutes: 25
        run: npm run test:t3-exit -- --context kind-nylorun --host-address 172.17.0.1
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl --context kind-nylorun get nodes,pods,sandboxes,pvc,networkpolicies -A -o wide || true
          kubectl --context kind-nylorun -n agent-sandbox-system logs deployment/agent-sandbox-controller --tail=200 || true
          docker ps -a
  # The tier's summary. It is `ci`, the required check, where it gates a merge:
  # in the merge queue and on a release PR. Elsewhere it is named for its event,
  # so a PR's feedback never stands in for `ci`, and publish.yml reads the merge
  # queue's `ci` on a release commit rather than main's `ci (push)`.
  ci:
    if: always()
    needs: [scope, check, runtime-unit, smoke-starter, smoke-dev, acceptance, macos, consumers, integration, stack, sandboxes]
    name: ${{ (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && needs.scope.outputs.full == 'true')) && 'ci' || format('ci ({0})', github.event_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job of the tier to pass
        env:
          FULL: ${{ needs.scope.outputs.full }}
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        # Every job must succeed, except that a fast run skips the full tier.
        run: |
          failed=$(jq -r --arg full "$FULL" '
            to_entries[]
            | select(.value.result != "success")
            | select(($full != "true" and .value.result == "skipped" and (.key | IN("scope", "check", "runtime-unit") | not)) | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          echo "${failed:-every job of the tier passed}"
          [[ -z "$failed" ]]
