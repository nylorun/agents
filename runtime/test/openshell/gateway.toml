# OpenShell gateway for the sandbox integration tests (Sandboxes v3, P3): Docker
# driver, plaintext on loopback, sandbox JWTs signed with a key test/openshell/up.mjs
# generates. `grpc_endpoint` stays unset: the host-networked supervisor then dials
# 127.0.0.1:8080, which works on Linux and on Docker Desktop.
[openshell]
version = 2

[openshell.gateway]
health_bind_address = "0.0.0.0:8081"
log_level           = "info"
compute_driver      = "docker"
disable_tls         = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/jwt/signing.pem"
public_key_path  = "/etc/openshell/jwt/public.pem"
kid_path         = "/etc/openshell/jwt/kid"
gateway_id       = "nylorun-test"

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.drivers.docker]
default_image         = "nvcr.io/nvidia/base/ubuntu:24.04"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.2"
supervisor_image      = "ghcr.io/nvidia/openshell/supervisor:0.1.2"
image_pull_policy     = "if_not_present"
sandbox_label         = "nylorun-test"
app_armor_profile     = "Unconfined"
